version: 2

project_name: matchmark

dist: dist

builds:
  - id: matchmark
    dir: source
    main: ./cmd/server
    binary: matchmark
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: matchmark
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "matchmark_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs(\([[:word:]]+\))??:'
      - '^test(\([[:word:]]+\))??:'
      - '^chore(\([[:word:]]+\))??:'
      - '^ci(\([[:word:]]+\))??:'

release:
  prerelease: auto
