openapi: 3.0.3
info:
  title: MatchMark API
  version: 2.0.0
  description: Admin, scorer, spectator and report endpoints of the MatchMark scoring server.
servers:
  - url: /
tags:
  - name: admin-auth
  - name: users
  - name: audit
  - name: club
  - name: shooters
  - name: competitions
  - name: entries
  - name: pairings
  - name: scorer
  - name: spectator
  - name: reports
paths:
  /api/admin/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Log in with username and password and set the mm_session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Logged in
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          description: Too many login attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Log out and clear the mm_session cookie
      responses:
        '204':
          description: Logged out
  /api/admin/password:
    post:
      operationId: adminChangePassword
      tags: [admin-auth]
      summary: Change the signed-in user's password and end their other sessions
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          description: Too many attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/session:
    get:
      operationId: adminSession
      tags: [admin-auth]
      summary: Check that the user session is valid
      security:
        - adminCookie: []
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user must change their password first (error is password_change_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/backup:
    get:
      operationId: adminBackup
      tags: [admin-auth]
      summary: Download a consistent backup of the database (admins with the backup permission only)
      security:
        - adminCookie: []
      responses:
        '200':
          description: SQLite database snapshot
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin with the backup permission (error is backup_not_permitted), or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: Browse the append-only audit log, newest first, paged and filterable (admin only)
      security:
        - adminCookie: []
      parameters:
        - name: user
          in: query
          description: Username as recorded at the time of the event
          schema:
            type: string
        - name: action
          in: query
          description: Exact action, for example stage.lock or login_failed
          schema:
            type: string
        - name: from
          in: query
          description: First day to include (UTC)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day to include (UTC)
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: One page of audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: A filter or paging parameter is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/club:
    get:
      operationId: getClub
      tags: [club]
      summary: Club name and logo state, shown on public pages
      responses:
        '200':
          description: Club settings; version changes on every edit and is used as an image cache-buster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
    put:
      operationId: setClub
      tags: [club]
      summary: Set the club name, trimmed and at most 100 characters (admin only)
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Updated club settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/club/logo:
    get:
      operationId: getClubLogo
      tags: [club]
      summary: The club logo; sends Cache-Control no-cache, so append ?v=version as a cache-buster
      parameters:
        - name: v
          in: query
          description: Cache-buster, ignored by the server
          schema:
            type: string
      responses:
        '200':
          description: The logo image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setClubLogo
      tags: [club]
      summary: Upload the club logo as the raw request body; PNG or JPEG only, at most 512 KB and 2048 by 2048 pixels (admin only)
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Logo stored
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      operationId: deleteClubLogo
      tags: [club]
      summary: Remove the club logo (admin only)
      security:
        - adminCookie: []
      responses:
        '204':
          description: Logo removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users with role and status (admin only)
      security:
        - adminCookie: []
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user with a temporary password that must be changed at first login (admin only)
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The username is already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/users/{userID}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: deactivateUser
      tags: [users]
      summary: Deactivate a user and end their sessions; the last active admin is refused (admin only)
      security:
        - adminCookie: []
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/users/{userID}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: reactivateUser
      tags: [users]
      summary: Reactivate a deactivated user (admin only)
      security:
        - adminCookie: []
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/users/{userID}/reset-password:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Set a temporary password that must be changed at next login and end the user's sessions (admin only)
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/users/{userID}/role:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      operationId: setUserRole
      tags: [users]
      summary: Promote to admin or demote to user; demotion ends sessions and the last active admin is refused (admin only)
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/users/{userID}/backup-permission:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      operationId: setUserBackupPermission
      tags: [users]
      summary: Allow or forbid an admin to download backups; refused for regular users (admin only)
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBackupPermissionRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an admin, or must change their password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/shooters:
    get:
      operationId: listShooters
      tags: [shooters]
      security:
        - adminCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive partial match on WAID or first/last name. Without it all shooters are returned.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results. Defaults to 20 when q is given, otherwise unlimited.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Matching shooters
          content:
            application/json:
              schema:
                type: object
                required: [shooters]
                properties:
                  shooters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shooter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
    post:
      operationId: createShooter
      tags: [shooters]
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShooterInput'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/shooters/import:
    post:
      operationId: importShooter
      tags: [shooters]
      summary: Import a WA1500 hit as a local shooter, matching by WAID and then by name
      description: >-
        A WAID match updates that shooter. Without a WAID match, shooters sharing the first and last
        name (case-insensitive) make the call answer 409 with candidates; resend with
        update_shooter_id (one of the candidates, otherwise 422) or create_new true. Otherwise a new shooter is created.
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShooterImportInput'
      responses:
        '200':
          description: An existing shooter was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShooterImportResult'
        '201':
          description: A new shooter was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShooterImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Local shooters share the name; the client must choose one or create a new shooter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShooterImportConflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/wa1500/search:
    get:
      operationId: searchWa1500
      tags: [shooters]
      summary: Search the WA1500 register by name, club or WAID (cached, rate limited)
      security:
        - adminCookie: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Matching WA1500 shooters
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wa1500Shooter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          description: Too many WA1500 searches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: WA1500 is unreachable or returned an unusable response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/shooters/{shooterID}:
    parameters:
      - $ref: '#/components/parameters/ShooterID'
    get:
      operationId: getShooter
      tags: [shooters]
      security:
        - adminCookie: []
      responses:
        '200':
          description: The shooter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shooter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateShooter
      tags: [shooters]
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShooterInput'
      responses:
        '200':
          description: The updated shooter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shooter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      operationId: deleteShooter
      tags: [shooters]
      security:
        - adminCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      security:
        - adminCookie: []
      responses:
        '200':
          description: All competitions
          content:
            application/json:
              schema:
                type: object
                required: [competitions]
                properties:
                  competitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Competition'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCompetition
      tags: [competitions]
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionInput'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/competitions/{competitionID}:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    get:
      operationId: getCompetition
      tags: [competitions]
      security:
        - adminCookie: []
      responses:
        '200':
          description: The competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCompetition
      tags: [competitions]
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionInput'
      responses:
        '200':
          description: The updated competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      operationId: deleteCompetition
      tags: [competitions]
      security:
        - adminCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/competitions/{competitionID}/status:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    post:
      operationId: setCompetitionStatus
      tags: [competitions]
      summary: Advance the competition status (draft, active, finished)
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/CompetitionStatus'
      responses:
        '200':
          description: The new status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    $ref: '#/components/schemas/CompetitionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/competitions/{competitionID}/next-stage:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    post:
      operationId: startNextStage
      tags: [competitions]
      summary: Start the next stage once every manned, non-withdrawn lane has accepted the current one
      security:
        - adminCookie: []
      responses:
        '200':
          description: The new current stage
          content:
            application/json:
              schema:
                type: object
                required: [current_stage]
                properties:
                  current_stage:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/competitions/{competitionID}/control-room:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    get:
      operationId: getControlRoom
      tags: [competitions]
      summary: The current stage with one row per manned lane
      description: |
        Answers 409 while the competition is a draft. connected is best-effort: it is true while the lane's device holds an open scorer stream and is never stored.
      security:
        - adminCookie: []
      responses:
        '200':
          description: Control room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/competitions/{competitionID}/stage-events:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    get:
      operationId: listStageEvents
      tags: [competitions]
      summary: Stage event history with lock and dispute counts per scorer
      description: |
        Events are oldest first and cover locks, acceptances, disputes, accept-all and unlocks. Device actors carry the shooter and scorer resolved from the pairing. The per-scorer counts cover the filtered events.
      security:
        - adminCookie: []
      parameters:
        - name: scorer
          in: query
          description: Exact scorer name
          schema:
            type: string
        - name: shooter
          in: query
          description: Exact shooter name
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Stage event history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
