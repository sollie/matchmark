        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/version:
    get:
      operationId: getVersion
      tags: [spectator]
      summary: Build version of the running binary
      responses:
        '200':
          description: The build version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    example: v1.2.3
  /api/rulebook:
    get:
      operationId: getRulebook
      tags: [spectator]
      summary: Courses of fire and ring values
      responses:
        '200':
          description: The rulebook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rulebook'
  /api/spectator/competitions:
    get:
      operationId: listSpectatorCompetitions
      tags: [spectator]
      summary: Competitions that are not drafts
      responses:
        '200':
          description: Public competitions
          content:
            application/json:
              schema:
                type: object
                required: [competitions]
                properties:
                  competitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Competition'
  /api/spectator/competitions/{competitionID}/standings:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    get:
      operationId: getSpectatorStandings
      tags: [spectator]
      summary: Standings filtered by the competition's visibility flags
      responses:
        '200':
          description: Ranked standings
          content:
            application/json:
              schema:
                type: object
                required: [standings]
                properties:
                  standings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Standing'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/spectator/competitions/{competitionID}/results:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    get:
      operationId: getSpectatorResults
      tags: [spectator]
      summary: Printable results of a finished competition, filtered by the visibility flags
      description: >
        Ranked per category by total then X count; entries tie only when both
        are equal and withdrawn entries are left out. Hidden names also hide
        WAID and the new shooters list; hidden stage scores omit `score`;
        hidden ring counts omit `x_count`. Answers 404 unless the competition
        is finished.
      responses:
        '200':
          description: The results
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/spectator/competitions/{competitionID}/stream:
    parameters:
      - $ref: '#/components/parameters/CompetitionID'
    get:
      operationId: streamSpectatorUpdates
      tags: [spectator]
      summary: Live updates as server-sent events
      description: >
        Sends a `snapshot` event with the standings on connect and
        again after every change, coalesced over about 250 ms. A `: heartbeat`
        comment is sent every 25 seconds. The server closes the stream after
        30 minutes and the client reconnects, which yields a fresh snapshot, so
        no replay or `Last-Event-ID` is needed. Visibility flags apply as for
        the standings endpoint. At most 500 streams are served at once.
      responses:
        '200':
          description: Event stream; each `snapshot` event carries a SpectatorSnapshot as JSON data
          content:
            text/event-stream:
              schema:
                type: string
              x-event-schemas:
                snapshot:
                  $ref: '#/components/schemas/SpectatorSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Too many open streams
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: mm_session
    deviceBearer:
      type: http
      scheme: bearer
  parameters:
    CompetitionID:
      name: competitionID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ShooterID:
      name: shooterID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EntryID:
      name: entryID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Stage:
      name: stage
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Created:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                type: integer
                format: int64
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted:
                type: boolean
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with current state (stage locked, lane not manned, not between stages)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminScoringRequired:
      description: Single-lane competitions require admin scoring
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The action is not permitted for this device
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Club:
      type: object
      required: [name, has_logo, version]
      properties:
        name:
          type: string
          description: Empty when no name is set
        has_logo:
          type: boolean
        version:
          type: integer
          format: int64
    Wa1500Shooter:
      type: object
      required: [waid, first_name, last_name, country, club]
      properties:
        waid:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        country:
          type: string
        club:
          type: string
    Rulebook:
      type: object
      required: [courses, rings]
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/RulebookCourse'
        rings:
          type: array
          items:
            $ref: '#/components/schemas/RulebookRing'
    RulebookCourse:
      type: object
      required: [key, label, discipline, total_shots, categories, stages]
      properties:
        key:
          type: string
        label:
          type: string
        discipline:
          type: string
        total_shots:
          type: integer
        categories:
          type: array
          description: Categories an entry may have in this course.
          items:
            type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/RulebookStage'
    RulebookStage:
      type: object
      required: [stage_number, distance, expected_shots, time_seconds, position]
      properties:
        stage_number:
          type: integer
        distance:
          type: string
        expected_shots:
          type: integer
        time_seconds:
          type: integer
        position:
          type: string
    RulebookRing:
      type: object
      required: [ring, value]
      properties:
        ring:
          type: string
        value:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 16
          maxLength: 128
    SessionUser:
      type: object
      required: [username, role, can_download_backup]
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        can_download_backup:
          type: boolean
    UserRole:
      type: string
      enum: [admin, user]
    User:
      type: object
      required: [id, username, role, active, can_download_backup, must_change_password]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        can_download_backup:
          type: boolean
        must_change_password:
          type: boolean
    AuditEntry:
      type: object
      required: [id, time, user_id, username, action, target, details, ip]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        user_id:
          type: integer
          nullable: true
          description: Null for devices and failed logins
        username:
          type: string
          description: The username at the time of the event, or device
        action:
          type: string
        target:
          type: string
        details:
          type: string
        ip:
          type: string
    AuditPage:
      type: object
      required: [entries, total, page, page_size]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 16
          maxLength: 128
    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    SetBackupPermissionRequest:
      type: object
      required: [can_download_backup]
      properties:
        can_download_backup:
          type: boolean
    CreateUserRequest:
      type: object
      required: [username, role, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9._-]+$'
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          type: string
          minLength: 16
          maxLength: 128
    CompetitionStatus:
      type: string
      enum: [draft, active, finished]
    Shooter:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
        - $ref: '#/components/schemas/ShooterInput'
    ShooterImportInput:
      allOf:
        - $ref: '#/components/schemas/ShooterInput'
        - type: object
          properties:
            update_shooter_id:
              type: integer
              format: int64
              description: A candidate from an earlier 409 to update with the imported data
            create_new:
              type: boolean
              description: Create a new shooter although the name matches existing ones
    ShooterImportResult:
      type: object
      required: [id, action]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
          enum: [created, updated]
    ShooterImportConflict:
      type: object
      required: [error, candidates]
      properties:
        error:
          type: string
          enum: [name_conflict]
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Shooter'
    ShooterInput:
      type: object
      required: [last_name, first_name, sex, country, club, waid]
      properties:
        last_name:
          type: string
          description: Must already be normalized (uppercase, single spaces, trimmed); otherwise the call answers 422.
        first_name:
          type: string
          description: Must already be normalized (each word capitalised, also after a hyphen or apostrophe, single spaces, trimmed); otherwise the call answers 422.
        sex:
          type: string
          enum: [M, F]
        country:
          type: string
        club:
          type: string
        waid:
          type: string
    CompetitionInput:
      type: object
      required: [name, date, course]
      properties:
        name:
          type: string
        date:
          type: string
          description: ISO 8601 calendar date, YYYY-MM-DD
        course:
          type: string
          description: Course of fire key from the rulebook
    Competition:
      allOf:
        - type: object
          required: [id, status, current_stage]
          properties:
            id:
              type: integer
              format: int64
            status:
              $ref: '#/components/schemas/CompetitionStatus'
            current_stage:
              type: integer
              description: Stage the competition is on. Stage 1 at activation; moved only by starting the next stage
        - $ref: '#/components/schemas/CompetitionInput'
    Visibility:
      type: object
      required: [show_names, show_clubs, show_countries, show_stage_scores, show_ring_counts]
      properties:
        show_names:
          type: boolean
        show_clubs:
          type: boolean
        show_countries:
          type: boolean
        show_stage_scores:
          type: boolean
        show_ring_counts:
          type: boolean
    Entry:
      type: object
      required: [id, competition_id, shooter_id, category, lane, withdrawn]
      properties:
        id:
          type: integer
          format: int64
        competition_id:
          type: integer
          format: int64
        shooter_id:
          type: integer
          format: int64
        category:
          type: string
        lane:
          type: integer
        withdrawn:
          type: boolean
    EntryStage:
      type: object
      required: [stage_number, expected_shots, status, scorer_lane, scorer_name, score, shots_entered]
      properties:
        stage_number:
          type: integer
        expected_shots:
          type: integer
        status:
          $ref: '#/components/schemas/StageStatus'
        scorer_lane:
          type: integer
          nullable: true
        scorer_name:
          type: string
          nullable: true
        score:
          type: integer
          description: Stage score from the stored ring counts, whether or not the stage is accepted
        shots_entered:
          type: integer
          description: Sum of all stored ring counts
    EntryWithStages:
      allOf:
        - $ref: '#/components/schemas/Entry'
        - type: object
          required: [stages]
          properties:
            stages:
              type: array
              items:
                $ref: '#/components/schemas/EntryStage'
    RingCounts:
      type: object
      required: [x, '10', '9', '8', '7', '0', miss]
      properties:
        x:
          type: integer
          minimum: 0
        '10':
          type: integer
          minimum: 0
        '9':
          type: integer
          minimum: 0
        '8':
          type: integer
          minimum: 0
        '7':
          type: integer
          minimum: 0
        '0':
          type: integer
          minimum: 0
        miss:
          type: integer
          minimum: 0
    Pairing:
      type: object
      required: [id, lane, revoked]
      properties:
        id:
          type: integer
          format: int64
        lane:
          type: integer
        revoked:
          type: boolean
    ScorecardSummary:
      type: object
      required: [shooter, lane, scorers]
      properties:
        shooter:
          type: string
        lane:
          type: integer
        scorers:
          type: array
          description: One item per accepted stage; Range admin when the admin scored the stage
          items:
            type: object
            required: [stage, scorer]
            properties:
              stage:
                type: integer
              scorer:
                type: string
    ScorerSession:
      type: object
      required: [competition_id, lane, score_lane, current_stage, entry_id, shooter_name, stages, phase]
      properties:
        competition_id:
          type: integer
          format: int64
        lane:
          type: integer
        score_lane:
          type: integer
        current_stage:
          type: integer
          description: The competition's current stage; devices can score only this stage. Zero in the finished phase
        entry_id:
          type: integer
          format: int64
        shooter_name:
          type: string
        stages:
          type: array
          items:
            type: object
            allOf:
              - $ref: '#/components/schemas/RingCounts'
              - type: object
                required: [stage_number, expected_shots, status, disputed]
                properties:
                  stage_number:
                    type: integer
                  expected_shots:
                    type: integer
                  status:
                    $ref: '#/components/schemas/StageStatus'
                  disputed:
                    type: boolean
                    description: True from a dispute until the scorer locks the stage again
        phase:
          type: string
          enum: [not_started, scoring, waiting, needs_acceptance, next_stage, finished]
          description: Derived by the server from the current stage. not_started while the competition is a draft (the device is paired but shows only its lane; the other fields are empty); scoring while the score lane's current stage is open (including after a dispute); next_stage when the admin has started the stage and the scorer has not saved hits or locked it yet; needs_acceptance when the device's own current stage awaits acceptance and it has nothing left to score; finished once the competition is finished (the other fields are then empty and the pairing is revoked)
        acceptance:
          description: Present while phase is needs_acceptance
          allOf:
            - $ref: '#/components/schemas/RingCounts'
            - type: object
              required: [stage_number, total, scorer_name]
              properties:
                stage_number:
                  type: integer
                total:
                  type: integer
                scorer_name:
                  type: string
    ControlRoom:
      type: object
      required: [current_stage, can_start_next, can_accept_all, lanes]
      properties:
        current_stage:
          type: integer
        can_start_next:
          type: boolean
          description: True at the gate, when every manned lane has accepted the current stage and a later stage exists
        can_accept_all:
          type: boolean
          description: True when no manned lane is open for the current stage and at least one awaits acceptance
        lanes:
          type: array
          items:
            $ref: '#/components/schemas/ControlRoomLane'
    ControlRoomLane:
      type: object
      required: [lane, entry_id, shooter_name, scorer_name, status, disputed, disputes, paired, connected]
      properties:
        lane:
          type: integer
        entry_id:
          type: integer
        shooter_name:
          type: string
        scorer_name:
          type: string
          description: The locking scorer, or the scorer the lane is derived to have; empty when the lane is scored by the admin
        status:
          $ref: '#/components/schemas/StageStatus'
        disputed:
          type: boolean
          description: The stage is open again after a dispute
        disputes:
          type: integer
          description: Disputes across all stages of the competition
        paired:
          type: boolean
        connected:
          type: boolean
          description: Best-effort, from open scorer streams
    StageHistory:
      type: object
      required: [events, scorers]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/StageHistoryEvent'
        scorers:
          type: array
          items:
            $ref: '#/components/schemas/ScorerDisputes'
    StageHistoryEvent:
      type: object
      required: [id, time, stage, entry_id, event, actor_type, actor_name, shooter_name, scorer_name]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        stage:
          type: integer
        entry_id:
          type: integer
        event:
          type: string
          enum: [locked, accepted, disputed, accepted_all, unlocked]
        actor_type:
          type: string
          enum: [device, user]
        actor_name:
          type: string
          description: device for a paired device, otherwise the username
        shooter_name:
          type: string
        scorer_name:
          type: string
          description: The locking scorer; empty when the admin scored the stage
    ScorerDisputes:
      type: object
      required: [scorer_name, locks, disputes]
      properties:
        scorer_name:
          type: string
        locks:
          type: integer
        disputes:
          type: integer
    StageStatus:
      type: string
      enum: [open, awaiting_acceptance, accepted]
      description: A device lock leaves a stage awaiting acceptance, an admin lock or accept makes it accepted. Only accepted stages count in public views and reports
    StageStatusResult:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/StageStatus'
    StageScore:
      type: object
      required: [stage, accepted, state]
      properties:
        stage:
          type: integer
        score:
          type: integer
          description: Present only when stage scores are visible and the stage is accepted
        accepted:
          type: boolean
        state:
          $ref: '#/components/schemas/SpectatorStageState'
        ring_counts:
          $ref: '#/components/schemas/RingCounts'
    Standing:
      type: object
      required: [lane, category, withdrawn, total]
      properties:
        lane:
          type: integer
        category:
          type: string
        withdrawn:
          type: boolean
        total:
          type: integer
        last_name:
          type: string
        first_name:
          type: string
        club:
          type: string
        country:
          type: string
        x_count:
          type: integer
        ring_counts:
          $ref: '#/components/schemas/RingCounts'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageScore'
    Results:
      type: object
      required: [competition, stages, categories, new_shooters]
      properties:
        competition:
          type: object
          required: [id, name, date, course, course_label]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            date:
              type: string
            course:
              type: string
              description: Course of fire key from the rulebook
            course_label:
              type: string
        stages:
          type: array
          items:
            type: integer
          description: Stage numbers of the course of fire, in order
        categories:
          type: array
          description: Categories with at least one non-withdrawn entry, in rulebook order
          items:
            type: object
            required: [category, rows]
            properties:
              category:
                type: string
              rows:
                type: array
                items:
                  $ref: '#/components/schemas/ResultsRow'
        new_shooters:
          type: array
          description: Shooters without a WAID; empty when names are hidden
          items:
            $ref: '#/components/schemas/ResultsNewShooter'
    ResultsRow:
      type: object
      required: [rank, stages, total]
      properties:
        rank:
          type: integer
          description: Shared only when total and X count are both equal
        last_name:
          type: string
        first_name:
          type: string
        waid:
          type: string
        club:
          type: string
        country:
          type: string
        stages:
          type: array
          items:
            type: object
            required: [stage]
            properties:
              stage:
                type: integer
              score:
                type: integer
                description: Present for accepted stages when stage scores are visible
        total:
          type: integer
        x_count:
          type: integer
    ResultsNewShooter:
      type: object
      required: [last_name, first_name, category, total]
      properties:
        last_name:
          type: string
        first_name:
          type: string
        category:
          type: string
        club:
          type: string
        country:
          type: string
        total:
          type: integer
        x_count:
          type: integer
    SpectatorStageState:
      type: string
      enum: [not_started, in_progress, awaiting_acceptance, accepted]
      description: A stage after the current stage is not started; an open stage of the current or an earlier stage, including a disputed (reopened) one, is in progress; a locked stage awaits acceptance until it is accepted. Only an accepted stage has a score
    SpectatorSnapshot:
      type: object
      required: [current_stage, total_stages, status, standings]
      properties:
        status:
          type: string
          enum: [draft, active, finished]
          description: The competition's status, so a viewer notices when it finishes without reloading the list
        current_stage:
          type: integer
          description: The competition's current stage number
        total_stages:
          type: integer
          description: Number of stages in the competition's course of fire
        standings:
          type: array
          items:
            $ref: '#/components/schemas/Standing'
