      tags: [scorer]
      summary: The paired device's lane, score lane and stages
      security:
        - deviceBearer: []
      responses:
        '200':
          description: Scorer session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorerSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminScoringRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/scorer/stream:
    get:
      operationId: streamScorerSession
      tags: [scorer]
      summary: The paired device's session as server-sent events
      description: >
        Sends a `snapshot` event with the ScorerSession on connect and again
        after every change in the competition, coalesced over about 250 ms.
        When the pairing is revoked, a terminal `revoked` event with an empty
        JSON object is sent and the stream ends. When the competition
        finishes, a final `snapshot` with phase `finished` is sent and the
        stream ends. In both cases the client must forget its token and not
        reconnect; connecting with the token of a finished competition answers
        410. A `: heartbeat`
        comment is sent every 25 seconds and the server closes the stream
        after 30 minutes. The device token is sent in the Authorization header,
        so the client uses fetch instead of EventSource. Writes are always
        applied to the score lane the server derives at write time, so a
        client with a stale score lane cannot write to another lane's entry.
      security:
        - deviceBearer: []
      responses:
        '200':
          description: Event stream; each `snapshot` event carries a ScorerSession as JSON data
          content:
            text/event-stream:
              schema:
                type: string
              x-event-schemas:
                snapshot:
                  $ref: '#/components/schemas/ScorerSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminScoringRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The competition is finished; the device must forget its token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Too many open streams
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
