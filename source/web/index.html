<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <script>
      try {
        var t = localStorage.getItem("matchmark-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      try {
        var p = localStorage.getItem("matchmark-palette");
        if (p && /^[a-z-]+$/.test(p)) document.documentElement.setAttribute("data-palette", p);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/palettes.css" />
    <link rel="stylesheet" href="/src/app.css" />
    <title>MatchMark</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
