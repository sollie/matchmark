# =====================================================================
# MatchMark – Agent Input Bundle (PWA + Go REST + SQLite + Caddy)
# Version: 1.0
# Notes:
#  - YAML includes authoritative course-of-fire data and validation rules.
#  - Citations reference the exact sources used for stages/classes.
# =====================================================================

meta:
  project: "MatchMark"
  purpose: "WA1500/PPC scoring system with mobile/tablet-first PWA, Go REST backend, SQLite storage, Caddy TLS/proxy, Dockerized deployment."
  # Course-of-fire and classes corroborated from WA1500 sources. [1](https://www.namecheap.com/domains/domain-name-search/)[2](https://www.name.com/domain/search)
  # Scorecard field layout and labels taken from Swedish PPC scorecards uploaded by user. [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)[5](https://www.svenskappccupen.se/wp-content/uploads/2023/04/sm2023-invitation.pdf)
  # Swedish cheat-sheet referenced for stage grouping/flow alignment. [6](https://teliacompanyspace-my.sharepoint.com/personal/pal_sollie_telia_no/Documents/Microsoft%20Copilot%20Chat%20Files/Skjutkort-48-skott-med-copy.pdf)

deployment:
  entrypoint: caddy
  containers:
    - name: backend
      desc: "Go REST API service, listens on 0.0.0.0:8080"
    - name: frontend
      desc: "PWA build output served as static files by Caddy"
    - name: caddy
      desc: "TLS (Let’s Encrypt), static hosting, reverse proxy /api/* → backend:8080"
  caddy:
    proxy_rules:
      - path: "/api/*"
        upstream: "backend:8080"
    static_root: "/srv/frontend"
    tls: "automatic"

security:
  auth:
    method: "username_password"
    transport: "JWT_or_secure_session_cookie"
    password_hash: "argon2_or_bcrypt"
  roles:
    - name: "user"
      perms:
        - select_competition_and_lane
        - score_assigned_lane
        - lock_stage_self
    - name: "admin"
      perms:
        - manage_users
        - create_edit_competitions
        - assign_lanes
        - unlock_stages_any
        - export_results

ui_rules:
  stage_presentation: "single_stage_only"    # Only current stage visible
  navigation:
    next_prev: true
    previous_locked_view: "read_only_for_that_user"
  scoring_controls:
    keypad: ["X","10","9","8","7","0","M"]  # Mirrors printed card columns [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)[5](https://www.svenskappccupen.se/wp-content/uploads/2023/04/sm2023-invitation.pdf)
    undo_last: true
  guards:
    enforce_expected_shots: true             # Block entry > required stage shots [1](https://www.namecheap.com/domains/domain-name-search/)[2](https://www.name.com/domain/search)
  resume_logic: "resume_first_unlocked_stage_else_summary"
  outdoor_use:
    high_contrast: true
    large_tap_targets: true

locking_rules:
  type: "per_user_lock"
  flow:
    - user_scores_stage
    - user_presses_lock_stage
    - user_cannot_edit_that_stage_anymore
    - other_users_can_edit_their_stage_until_they_lock
    - admin_can_unlock_per_user_or_globally
  fully_locked_definition: "true_when_all_required_user_locks_present"

competition_setup:
  required_fields_per_competitor:
    - name            # Namn on scorecards [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)
    - wa_id           # WAID on scorecards [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)
    - lane_number
    - discipline      # 1500 | 60 | 48
    - weapon_class    # validated by discipline per WA1500 classes [1](https://www.namecheap.com/domains/domain-name-search/)
  validations:
    - unique_lane_per_competition: true
    - wa_id_format: "string_or_integer_by_rule"
    - weapon_class_allowed_for_discipline: true  # Enforce as per below classes list [1](https://www.namecheap.com/domains/domain-name-search/)
  peer_scoring_rule:
    mapping: "score_lane = (user_lane - 1) or lanes_total_if_user_lane_is_1"
    example:
      user_lane: 1
      lanes_total: 21
      score_lane: 21

disciplines_and_classes:
  "1500":
    eligible_classes:
      - "Revolver 1500"
      - "Pistol 1500"
      - "Revolver Optical Sight 1500"
      - "Pistol Optical Sight 1500"
    # 1500 classes list: WA1500 course descriptions. [1](https://www.namecheap.com/domains/domain-name-search/)
  "60":
    eligible_classes:
      - "Distinguished Revolver"
      - "Distinguished Pistol"
      - "Open Match"
    # 60-shot course classes: per WA1500. [1](https://www.namecheap.com/domains/domain-name-search/)
  "48":
    eligible_classes:
      - "Standard Revolver 4.25\""
      - "Standard Revolver 2.75\""
      - "Standard Revolver 2.75\" (5-shot)"  # 5-shot variant totals 40, not 48. [1](https://www.namecheap.com/domains/domain-name-search/)
      - "Standard Semi-Automatic Pistol 5.5\""
      - "Standard Semi-Automatic Pistol 3.65\""

courses_of_fire:
  # Distances, times, positions verified from WA1500 sources. [1](https://www.namecheap.com/domains/domain-name-search/)[2](https://www.name.com/domain/search)

  "1500":
    matches:
      - name: "Match 1"
        stages:
          - { idx: 1,  dist_yd: 7,  shots: 12, time_s: 20,  position: "standing_clear_of_barricade", notes: "revolvers_DA_only" }
          - { idx: 2,  dist_yd: 15, shots: 12, time_s: 20,  position: "standing_clear_of_barricade", notes: "revolvers_DA_only" }
      - name: "Match 2"
        stages:
          - idx: 3
            dist_yd: 25
            time_s: 90
            composite: true
            segments:
              - { shots: 6, position: "kneeling_no_support" }
              - { shots: 6, position: "left_barricade" }
              - { shots: 6, position: "right_barricade" }
            shots_total: 18
            notes: "revolvers_DA_only"
      - name: "Match 3"
        stages:
          - idx: 4
            dist_yd: 50
            time_s: 165
            composite: true
            segments:
              - { shots: 6, position: "sitting" }
              - { shots: 6, position: "prone" }
              - { shots: 6, position: "left_barricade" }
              - { shots: 6, position: "right_barricade" }
            shots_total: 24
            notes: "revolvers_may_use_SA"
      - name: "Match 4"
        stages:
          - { idx: 5, dist_yd: 25, shots: 12, time_s: 35, position: "standing_clear_of_barricade" }
          - { idx: 6, dist_yd: 25, shots: 12, time_s: 35, position: "standing_clear_of_barricade", notes: "repeat_series" }
      - name: "Match 5"
        stages:
          - { idx: 7,  dist_yd: 7,  shots: 12, time_s: 20,  position: "standing_clear_of_barricade", notes: "revolvers_DA_only" }
          - idx: 8
            dist_yd: 25
            time_s: 90
            composite: true
            segments:
              - { shots: 6, position: "kneeling_no_support" }
              - { shots: 6, position: "left_barricade" }
              - { shots: 6, position: "right_barricade" }
            shots_total: 18
            notes: "revolvers_DA_only"
          - idx: 9
            dist_yd: 50
            time_s: 165
            composite: true
            segments:
              - { shots: 6, position: "sitting" }
              - { shots: 6, position: "prone" }
              - { shots: 6, position: "left_barricade" }
              - { shots: 6, position: "right_barricade" }
            shots_total: 24
            notes: "revolvers_may_use_SA"
          - { idx: 10, dist_yd: 25, shots: 6,  time_s: 12, position: "standing_clear_of_barricade" }
    total_shots: 150

  "60":   # Identical to Match 5 of the 1500. [1](https://www.namecheap.com/domains/domain-name-search/)
    stages:
      - { idx: 1, dist_yd: 7,  shots: 12, time_s: 20,  position: "standing_clear_of_barricade" }
      - idx: 2
        dist_yd: 25
        time_s: 90
        composite: true
        segments:
          - { shots: 6, position: "kneeling_no_support" }
          - { shots: 6, position: "left_barricade" }
          - { shots: 6, position: "right_barricade" }
        shots_total: 18
      - idx: 3
        dist_yd: 50
        time_s: 165
        composite: true
        segments:
          - { shots: 6, position: "sitting" }
          - { shots: 6, position: "prone" }
          - { shots: 6, position: "left_barricade" }
          - { shots: 6, position: "right_barricade" }
        shots_total: 24
      - { idx: 4, dist_yd: 25, shots: 6,  time_s: 12, position: "standing_clear_of_barricade" }
    total_shots: 60

  "48":   # 48-shot “service/standard” course. [1](https://www.namecheap.com/domains/domain-name-search/)
    stages:
      - { idx: 1, dist_yd: 3,  shots: 6,  time_s: 8,  position: "standing_single_handed" }
      - { idx: 2, dist_yd: 7,  shots: 12, time_s: 20, position: "standing_clear_of_barricade" }
      - { idx: 3, dist_yd: 15, shots: 12, time_s: 20, position: "standing_clear_of_barricade" }
      - idx: 4
        dist_yd: 25
        time_s: 90
        composite: true
        segments:
          - { shots: 6, position: "kneeling_supported_at_post" }
          - { shots: 6, position: "left_barricade" }
          - { shots: 6, position: "right_barricade" }
        shots_total: 18
    total_shots: 48
    variant_5_shot_revolver:
      total_shots: 40      # Special division totals 40, entries in multiples of 5. [1](https://www.namecheap.com/domains/domain-name-search/)

scoring:
  rings: ["X","10","9","8","7","0","M"]  # Score columns on official cards. [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)[5](https://www.svenskappccupen.se/wp-content/uploads/2023/04/sm2023-invitation.pdf)
  points:
    X: 10
    "10": 10
    "9": 9
    "8": 8
    "7": 7
    "0": 0
    M: 0
  count_x_separately: true  # X counted as 10 + separate X tally (card column). [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)
  per_stage_validations:
    - "entered_hits_must_equal_expected_shots"
    - "no_negative_or_overflow_entries"
    - "ring_values_must_be_one_of_list"

exports:
  competition_report_fields:
    - competition_name
    - shooter_name
    - wa_id
    - discipline
    - weapon_class
    - total_points
    - x_count
    - breakdown_10_9_8_7_0_M
  pdf_layout:
    style: "mirror_official_scorecards"
    labels:
      name: "Namn"
      waid: "WAID"
      club: "Klubb"
      total: "Totalt"
      points: "Poäng"
      signatures: ["Mark","Skytt","Tävlingsledning"]
    # Labels taken from Swedish scorecards. [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)
  formats: ["PDF","CSV","JSON"]

api_contracts:
  # High-level route map; implement authZ checks (role, competition, lane, lock state).
  auth:
    - { method: "POST", path: "/api/login" }
    - { method: "GET",  path: "/api/users/me" }
    - { method: "POST", path: "/api/users", role: "admin" }
    - { method: "PUT",  path: "/api/users/{id}", role: "admin" }
  competitions:
    - { method: "GET",  path: "/api/competitions" }
    - { method: "POST", path: "/api/competitions", role: "admin" }
    - { method: "GET",  path: "/api/competitions/{id}" }
    - { method: "POST", path: "/api/competitions/{id}/shooters", role: "admin" }
  scoring:
    - { method: "GET",  path: "/api/competitions/{id}/lanes/{lane}/stage/{stage}" }
    - { method: "POST", path: "/api/competitions/{id}/lanes/{lane}/stage/{stage}/hits" }
    - { method: "POST", path: "/api/competitions/{id}/lanes/{lane}/stage/{stage}/lock" }
    - { method: "POST", path: "/api/competitions/{id}/lanes/{lane}/stage/{stage}/unlock", role: "admin" }
  export:
    - { method: "GET",  path: "/api/competitions/{id}/export/pdf",  role: "admin" }
    - { method: "GET",  path: "/api/competitions/{id}/export/csv",  role: "admin" }
    - { method: "GET",  path: "/api/competitions/{id}/export/json", role: "admin" }

db_schema:
  users:
    columns: [id, username, password_hash, role]
  competitions:
    columns: [id, name, date, lanes_total]
  shooters:
    columns: [id, competition_id, name, wa_id, lane_number, discipline, weapon_class]
  stages:
    columns: [id, shooter_id, stage_number, expected_shots, fully_locked]
  hits:
    columns: [id, stage_id, ring, points]
  stage_locks:
    columns: [id, stage_id, user_id, locked, locked_time]

scorecard_layout_refs:
  # Structural cues pulled from PDFs (grid headers and scoring columns). [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)[4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)[5](https://www.svenskappccupen.se/wp-content/uploads/2023/04/sm2023-invitation.pdf)
  shared_columns: ["Poäng","X","10","9","8","7","0","M"]
  48_shot_card:
    groups: ["St. 1+2","St. 3+4","Totalt"]   # 18 + 30 = 48 structure on card. [3](https://www.svenskappccupen.se/wp-content/uploads/2023/03/PPC-Rulebook-2023-eng.pdf)
  60_shot_card:
    groups: ["St. 1+2","St. 3+4","Totalt"]   # 30 + 30 = 60. [4](https://www.svenskappccupen.se/wp-content/uploads/2023/04/SHB-Uppdaterat-Kap-O-PPC-2023.pdf)
  1500_card:
    groups: ["Match 1-4","Match 5","Totalt"] # With per-match stage blocks. [5](https://www.svenskappccupen.se/wp-content/uploads/2023/04/sm2023-invitation.pdf)
