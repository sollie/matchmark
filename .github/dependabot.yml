version: 2

updates:
  - package-ecosystem: gomod
    directory: /source
    schedule:
      interval: weekly
      day: monday
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /source/web
      - /source/api
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        update-types:
          - minor
          - patch
