name: Image

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      version:
        type: string
        default: dev

jobs:
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t matchmark:ci .

      - name: Smoke test
        run: scripts/smoke-image.sh matchmark:ci

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: matchmark:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: inputs.push
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag matchmark:ci "${repo}:${VERSION}-${ARCH}"
          docker push "${repo}:${VERSION}-${ARCH}"

  manifest:
    name: Manifest
    if: inputs.push
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${VERSION}"
          tags=("${repo}:${version}")
          if [[ "$version" != *-* ]]; then
            minor="${version%.*}"
            tags+=("${repo}:${minor}" "${repo}:latest")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" \
            "${repo}:${version}-amd64" "${repo}:${version}-arm64"
