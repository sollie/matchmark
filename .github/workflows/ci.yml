name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7

      - name: No comments
        working-directory: .
        run: scripts/check-no-comments.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: source

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install
        working-directory: source/web
        run: npm ci

      - name: Build web
        working-directory: source/web
        run: npm run build

      - name: Install browsers
        working-directory: source/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E
        working-directory: source/web
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            source/web/playwright-report
            source/web/test-results
          retention-days: 7

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Test
        working-directory: source
        run: CGO_ENABLED=0 go test ./...

      - name: Build image
        run: docker build -t matchmark:ci .

      - name: Smoke test
        run: scripts/smoke-image.sh matchmark:ci

  darwin-arm64:
    name: Build (darwin/arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Build web
        working-directory: source/web
        run: npm ci && npm run build

      - name: Build
        working-directory: source
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
