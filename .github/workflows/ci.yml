name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      goreleaser: ${{ steps.filter.outputs.goreleaser }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            image:
              - Dockerfile
              - .dockerignore
              - scripts/smoke-image.sh
              - source/go.mod
              - source/go.sum
              - .github/workflows/ci.yml
              - .github/workflows/image.yml
              - .github/workflows/release.yml
            goreleaser:
              - .goreleaser.yaml
              - source/go.mod
              - source/go.sum
              - .github/workflows/ci.yml
              - .github/workflows/release.yml

  tests:
    name: Tests
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/tests.yml
    with:
      e2e-browsers: ${{ github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]' }}

  image:
    name: Image
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/image.yml

  goreleaser:
    name: GoReleaser
    needs: [changes, tests]
    if: github.event_name == 'pull_request' && needs.changes.outputs.goreleaser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: source/web/dist

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=publish
