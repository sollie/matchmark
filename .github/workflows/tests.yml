name: Tests

on:
  workflow_call:
    inputs:
      e2e-browsers:
        type: string
        default: '["chromium","firefox","webkit"]'

jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7

      - name: No comments
        working-directory: .
        run: scripts/check-no-comments.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Cross-compile
        run: |
          for target in windows/amd64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

      - name: Test
        run: |
          CGO_ENABLED=0 go test ./internal/db
          CGO_ENABLED=0 go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: source

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: source/web/dist
          retention-days: 7

  e2e-browser:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.e2e-browsers) }}
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: source/web/dist

      - name: Install
        working-directory: source/web
        run: npm ci

      - name: Check Playwright image matches lockfile
        working-directory: source/web
        run: test "$(node -p "require('./node_modules/@playwright/test/package.json').version")" = "1.64.1"

      - name: E2E
        working-directory: source/web
        run: npm run e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            source/web/playwright-report
            source/web/test-results
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: e2e-browser
    if: always()
    steps:
      - name: Require all browsers
        run: test "${{ needs.e2e-browser.result }}" = "success"
